<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>DDD 物理架构图 - my-ddd-demo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #020617; color: #e2e8f0; font-family: 'JetBrains Mono', monospace; padding: 40px; }
  .container { max-width: 1200px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 40px; }
  .header h1 { font-size: 24px; margin-bottom: 8px; }
  .dot { display: inline-block; width: 10px; height: 10px; background: #fbbf24; border-radius: 50%; margin-right: 8px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .subtitle { color: #94a3b8; font-size: 13px; }
  .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 30px; margin-bottom: 24px; }
  svg { width: 100%; height: auto; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1><span class="dot"></span>my-ddd-demo 物理架构图</h1>
    <p class="subtitle">Maven 模块打包 · CI/CD · 部署拓扑 · API 发布</p>
  </div>
  <div class="card">
    <svg viewBox="0 0 1100 780" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
          <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
        </marker>
        <marker id="arrow-g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
          <path d="M0,0 L8,3 L0,6 Z" fill="#34d399"/>
        </marker>
        <marker id="arrow-a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
          <path d="M0,0 L8,3 L0,6 Z" fill="#fbbf24"/>
        </marker>
      </defs>

      <rect width="1100" height="780" fill="url(#grid)"/>

      <text x="550" y="30" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="bold">物理架构 — Maven 模块 · 构建发布 · 部署拓扑</text>

      <!-- === Build Pipeline === -->
      <rect x="30" y="55" width="1040" height="200" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
      <rect x="30" y="55" width="1040" height="200" rx="8" fill="rgba(120,53,15,0.08)"/>
      <text x="550" y="80" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="bold">Maven 构建流水线</text>

      <!-- Source -->
      <rect x="55" y="100" width="140" height="50" rx="5" fill="rgba(8,51,68,0.3)" stroke="#22d3ee" stroke-width="1"/>
      <text x="125" y="124" text-anchor="middle" fill="#e2e8f0" font-size="10">GitHub Repo</text>
      <text x="125" y="140" text-anchor="middle" fill="#94a3b8" font-size="8">7 个 Maven 模块</text>

      <!-- Compile -->
      <rect x="240" y="100" width="130" height="50" rx="5" fill="rgba(6,78,59,0.3)" stroke="#34d399" stroke-width="1"/>
      <text x="305" y="124" text-anchor="middle" fill="#e2e8f0" font-size="10">mvn compile</text>
      <text x="305" y="140" text-anchor="middle" fill="#94a3b8" font-size="8">MapStruct 生成</text>

      <!-- Test -->
      <rect x="415" y="100" width="140" height="50" rx="5" fill="rgba(76,29,149,0.3)" stroke="#a78bfa" stroke-width="1"/>
      <text x="485" y="124" text-anchor="middle" fill="#e2e8f0" font-size="10">mvn test</text>
      <text x="485" y="140" text-anchor="middle" fill="#94a3b8" font-size="8">JUnit 5 · JaCoCo</text>

      <!-- Verify -->
      <rect x="600" y="100" width="130" height="50" rx="5" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1"/>
      <text x="665" y="124" text-anchor="middle" fill="#e2e8f0" font-size="10">mvn verify</text>
      <text x="665" y="140" text-anchor="middle" fill="#94a3b8" font-size="8">聚合覆盖率报告</text>

      <!-- Package -->
      <rect x="775" y="100" width="130" height="50" rx="5" fill="rgba(136,19,55,0.3)" stroke="#fb7185" stroke-width="1"/>
      <text x="840" y="124" text-anchor="middle" fill="#e2e8f0" font-size="10">mvn package</text>
      <text x="840" y="140" text-anchor="middle" fill="#94a3b8" font-size="8">jar 打包</text>

      <!-- Deploy -->
      <rect x="950" y="100" width="100" height="50" rx="5" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1"/>
      <text x="1000" y="124" text-anchor="middle" fill="#e2e8f0" font-size="10">mvn deploy</text>
      <text x="1000" y="140" text-anchor="middle" fill="#94a3b8" font-size="8">推送仓库</text>

      <!-- Arrows -->
      <line x1="195" y1="125" x2="237" y2="125" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
      <line x1="370" y1="125" x2="412" y2="125" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
      <line x1="555" y1="125" x2="597" y2="125" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
      <line x1="730" y1="125" x2="772" y2="125" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
      <line x1="905" y1="125" x2="947" y2="125" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

      <!-- Coverage Report -->
      <rect x="55" y="165" width="460" height="35" rx="5" fill="rgba(6,78,59,0.15)" stroke="#34d399" stroke-width="0.5" stroke-dasharray="3,3"/>
      <text x="285" y="180" text-anchor="middle" fill="#34d399" font-size="9">JaCoCo 聚合报告: my-ddd-demo-coverage/target/site/jacoco-aggregate/</text>
      <text x="285" y="193" text-anchor="middle" fill="#94a3b8" font-size="7">31 单元测试 · domain(16) + app(5) + infra(10)</text>

      <!-- API Publish -->
      <rect x="55" y="210" width="460" height="30" rx="5" fill="rgba(120,53,15,0.15)" stroke="#fbbf24" stroke-width="0.5" stroke-dasharray="3,3"/>
      <text x="285" y="230" text-anchor="middle" fill="#fbbf24" font-size="9">API 发布: mvn deploy -pl my-ddd-demo-api → Nexus 私有仓库</text>

      <!-- === Module Topology === -->
      <rect x="30" y="275" width="1040" height="200" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
      <rect x="30" y="275" width="1040" height="200" rx="8" fill="rgba(8,51,68,0.06)"/>
      <text x="550" y="300" text-anchor="middle" fill="#22d3ee" font-size="13" font-weight="bold">Maven 模块拓扑与依赖</text>

      <!-- Module: api -->
      <rect x="55" y="320" width="140" height="55" rx="5" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
      <text x="125" y="344" text-anchor="middle" fill="#e2e8f0" font-size="10">api</text>
      <text x="125" y="360" text-anchor="middle" fill="#94a3b8" font-size="7">Facade · Command · QueryDTO</text>

      <!-- Module: adapter -->
      <rect x="230" y="320" width="140" height="55" rx="5" fill="rgba(120,53,15,0.4)" stroke="#fbbf24" stroke-width="1"/>
      <text x="300" y="344" text-anchor="middle" fill="#e2e8f0" font-size="10">adapter</text>
      <text x="300" y="360" text-anchor="middle" fill="#94a3b8" font-size="7">Impl · Scheduler · Callback</text>

      <!-- Module: app -->
      <rect x="405" y="320" width="140" height="55" rx="5" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1"/>
      <text x="475" y="344" text-anchor="middle" fill="#e2e8f0" font-size="10">app</text>
      <text x="475" y="360" text-anchor="middle" fill="#94a3b8" font-size="7">Service · Factory · Assembler</text>

      <!-- Module: domain -->
      <rect x="580" y="315" width="140" height="65" rx="5" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="2"/>
      <text x="650" y="340" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="bold">domain ★</text>
      <text x="650" y="358" text-anchor="middle" fill="#94a3b8" font-size="7">Entity · VO · Repository接口</text>
      <text x="650" y="372" text-anchor="middle" fill="#94a3b8" font-size="7">Gateway接口 · 0依赖</text>

      <!-- Module: infra -->
      <rect x="580" y="400" width="140" height="55" rx="5" fill="rgba(251,146,60,0.4)" stroke="#fb923c" stroke-width="1"/>
      <text x="650" y="424" text-anchor="middle" fill="#e2e8f0" font-size="10">infra</text>
      <text x="650" y="440" text-anchor="middle" fill="#94a3b8" font-size="7">RepositoryImpl · DO · GatewayImpl</text>

      <!-- Module: common -->
      <rect x="755" y="400" width="130" height="55" rx="5" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1"/>
      <text x="820" y="424" text-anchor="middle" fill="#e2e8f0" font-size="10">common</text>
      <text x="820" y="440" text-anchor="middle" fill="#94a3b8" font-size="7">Exception · Enum · Result</text>

      <!-- Module: start -->
      <rect x="910" y="320" width="130" height="55" rx="5" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1"/>
      <text x="975" y="344" text-anchor="middle" fill="#e2e8f0" font-size="10">start</text>
      <text x="975" y="360" text-anchor="middle" fill="#94a3b8" font-size="7">Spring Boot 启动</text>

      <!-- Module: coverage -->
      <rect x="755" y="320" width="130" height="55" rx="5" fill="rgba(34,211,238,0.1)" stroke="#22d3ee" stroke-width="0.8" stroke-dasharray="3,3"/>
      <text x="820" y="344" text-anchor="middle" fill="#22d3ee" font-size="10">coverage</text>
      <text x="820" y="360" text-anchor="middle" fill="#94a3b8" font-size="7">JaCoCo 聚合</text>

      <!-- Dependency arrows -->
      <line x1="195" y1="347" x2="227" y2="347" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="370" y1="347" x2="402" y2="347" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="545" y1="347" x2="577" y2="340" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="720" y1="380" x2="720" y2="397" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-g)"/>
      <text x="735" y="392" fill="#a78bfa" font-size="7">实现</text>

      <line x1="720" y1="427" x2="752" y2="427" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- === Deploy Topology === -->
      <rect x="30" y="495" width="1040" height="260" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
      <rect x="30" y="495" width="1040" height="260" rx="8" fill="rgba(6,78,59,0.06)"/>
      <text x="550" y="520" text-anchor="middle" fill="#34d399" font-size="13" font-weight="bold">部署拓扑 & 运行时</text>

      <!-- Service Container -->
      <rect x="55" y="545" width="280" height="140" rx="6" fill="rgba(6,78,59,0.15)" stroke="#34d399" stroke-width="1" stroke-dasharray="5,2"/>
      <text x="195" y="565" text-anchor="middle" fill="#34d399" font-size="10">Spring Boot 应用容器</text>

      <rect x="75" y="580" width="240" height="35" rx="4" fill="rgba(6,78,59,0.3)" stroke="#34d399" stroke-width="1"/>
      <text x="195" y="602" text-anchor="middle" fill="#e2e8f0" font-size="9">Dubbo Provider · Adapter</text>

      <rect x="75" y="625" width="240" height="35" rx="4" fill="rgba(6,78,59,0.3)" stroke="#34d399" stroke-width="1"/>
      <text x="195" y="647" text-anchor="middle" fill="#e2e8f0" font-size="9">App Service · Domain</text>

      <!-- Maven Repo -->
      <rect x="385" y="555" width="200" height="55" rx="5" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1"/>
      <text x="485" y="578" text-anchor="middle" fill="#e2e8f0" font-size="10">Nexus 私有仓库</text>
      <text x="485" y="594" text-anchor="middle" fill="#94a3b8" font-size="8">my-ddd-demo-api:1.0-SNAPSHOT</text>

      <!-- RPC Consumer -->
      <rect x="385" y="625" width="200" height="55" rx="5" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1"/>
      <text x="485" y="648" text-anchor="middle" fill="#e2e8f0" font-size="10">其他团队服务</text>
      <text x="485" y="664" text-anchor="middle" fill="#94a3b8" font-size="8">引入 api 依赖 → Dubbo 调用</text>

      <!-- External Systems -->
      <rect x="640" y="545" width="200" height="55" rx="5" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1"/>
      <text x="740" y="567" text-anchor="middle" fill="#e2e8f0" font-size="10">外部系统</text>
      <text x="740" y="583" text-anchor="middle" fill="#94a3b8" font-size="8">公司 RPC 服务 · 审批系统</text>

      <!-- MQ -->
      <rect x="640" y="618" width="200" height="55" rx="5" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1"/>
      <text x="740" y="640" text-anchor="middle" fill="#e2e8f0" font-size="10">消息队列</text>
      <text x="740" y="656" text-anchor="middle" fill="#94a3b8" font-size="8">RocketMQ / Kafka</text>

      <!-- DB -->
      <rect x="880" y="545" width="170" height="55" rx="5" fill="rgba(76,29,149,0.3)" stroke="#a78bfa" stroke-width="1"/>
      <text x="965" y="567" text-anchor="middle" fill="#e2e8f0" font-size="10">数据库</text>
      <text x="965" y="583" text-anchor="middle" fill="#94a3b8" font-size="8">MySQL / 生产环境</text>

      <!-- Arrows -->
      <line x1="195" y1="615" x2="382" y2="582" stroke="#34d399" stroke-width="1" marker-end="url(#arrow-g)"/>
      <line x1="355" y1="647" x2="382" y2="647" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="585" y1="582" x2="637" y2="572" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="610" y="565" fill="#94a3b8" font-size="6">RPC 调用</text>

      <line x1="335" y1="647" x2="382" y2="647" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="360" y="640" fill="#94a3b8" font-size="6">API 依赖</text>

      <line x1="255" y1="660" x2="637" y2="645" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
      <text x="440" y="680" fill="#94a3b8" font-size="6">MQ 发布领域事件</text>

      <line x1="315" y1="645" x2="877" y2="572" stroke="#a78bfa" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow-g)"/>
      <text x="600" y="620" fill="#a78bfa" font-size="6">持久化</text>

      <!-- Timer -->
      <rect x="640" y="700" width="180" height="40" rx="4" fill="rgba(251,146,60,0.2)" stroke="#fb923c" stroke-width="1"/>
      <text x="730" y="724" text-anchor="middle" fill="#e2e8f0" font-size="9">@Scheduled 定时任务</text>

      <!-- MQ Consumer -->
      <rect x="840" y="700" width="170" height="40" rx="4" fill="rgba(251,146,60,0.2)" stroke="#fb923c" stroke-width="1"/>
      <text x="925" y="724" text-anchor="middle" fill="#e2e8f0" font-size="9">MQ Consumer 监听</text>

      <!-- Legend -->
      <text x="550" y="770" text-anchor="middle" fill="#94a3b8" font-size="8">domain ★ 是核心，0 外部依赖 · adapter 是唯一入口层 · API 模块可独立发布到 Maven 仓库供其他团队调用</text>

    </svg>
  </div>
</div>
</body>
</html>
