<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>DDD 业务架构图 - my-ddd-demo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #020617; color: #e2e8f0; font-family: 'JetBrains Mono', monospace; padding: 40px; }
  .container { max-width: 1200px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 40px; }
  .header h1 { font-size: 24px; margin-bottom: 8px; }
  .dot { display: inline-block; width: 10px; height: 10px; background: #22d3ee; border-radius: 50%; margin-right: 8px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .subtitle { color: #94a3b8; font-size: 13px; }
  .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 30px; margin-bottom: 24px; }
  svg { width: 100%; height: auto; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1><span class="dot"></span>my-ddd-demo 业务架构图</h1>
    <p class="subtitle">DDD 六层架构 + CQRS 读写分离 + 请求流转</p>
  </div>
  <div class="card">
    <svg viewBox="0 0 1100 820" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
          <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
        </marker>
        <marker id="arrow-cyan" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
          <path d="M0,0 L8,3 L0,6 Z" fill="#22d3ee"/>
        </marker>
        <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
          <path d="M0,0 L8,3 L0,6 Z" fill="#34d399"/>
        </marker>
      </defs>

      <rect width="1100" height="820" fill="url(#grid)"/>

      <!-- Title -->
      <text x="550" y="35" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="bold">DDD 业务架构 — CQRS 读写分离</text>

      <!-- === Layer backgrounds === -->

      <!-- API Layer -->
      <rect x="40" y="60" width="1020" height="100" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1" opacity="0.7"/>
      <rect x="40" y="60" width="1020" height="100" rx="8" fill="rgba(8,51,68,0.2)"/>
      <text x="55" y="82" fill="#22d3ee" font-size="11">API 接口层</text>

      <!-- Adapter Layer -->
      <rect x="40" y="170" width="1020" height="95" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1" opacity="0.7"/>
      <rect x="40" y="170" width="1020" height="95" rx="8" fill="rgba(120,53,15,0.15)"/>
      <text x="55" y="192" fill="#fbbf24" font-size="11">Adapter 适配层</text>

      <!-- App Layer -->
      <rect x="40" y="275" width="1020" height="105" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1" opacity="0.7"/>
      <rect x="40" y="275" width="1020" height="105" rx="8" fill="rgba(6,78,59,0.2)"/>
      <text x="55" y="297" fill="#34d399" font-size="11">App 应用层</text>

      <!-- Domain Layer -->
      <rect x="40" y="390" width="1020" height="130" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1" opacity="0.7"/>
      <rect x="40" y="390" width="1020" height="130" rx="8" fill="rgba(76,29,149,0.15)"/>
      <text x="55" y="412" fill="#a78bfa" font-size="11">Domain 领域层（核心）</text>

      <!-- Infra Layer -->
      <rect x="40" y="530" width="1020" height="100" rx="8" fill="#0f172a" stroke="#fb923c" stroke-width="1" opacity="0.7"/>
      <rect x="40" y="530" width="1020" height="100" rx="8" fill="rgba(251,146,60,0.1)"/>
      <text x="55" y="552" fill="#fb923c" font-size="11">Infra 基础设施层</text>

      <!-- Common -->
      <rect x="40" y="640" width="1020" height="55" rx="8" fill="#0f172a" stroke="#94a3b8" stroke-width="1" opacity="0.7"/>
      <rect x="40" y="640" width="1020" height="55" rx="8" fill="rgba(30,41,59,0.3)"/>
      <text x="55" y="662" fill="#94a3b8" font-size="11">Common 通用模块</text>

      <!-- === CQRS: Command Side (Left) === -->
      <rect x="60" y="72" width="440" height="78" rx="5" fill="#0f172a" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="280" y="92" text-anchor="middle" fill="#22d3ee" font-size="10">CQRS Command（写）</text>

      <!-- Command Flow boxes -->
      <rect x="75" y="100" width="140" height="32" rx="4" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
      <text x="145" y="121" text-anchor="middle" fill="#e2e8f0" font-size="10">ApplyOrderCommandFacade</text>

      <rect x="75" y="185" width="140" height="32" rx="4" fill="rgba(120,53,15,0.4)" stroke="#fbbf24" stroke-width="1"/>
      <text x="145" y="206" text-anchor="middle" fill="#e2e8f0" font-size="10">CommandFacadeImpl</text>

      <rect x="75" y="290" width="200" height="32" rx="4" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1"/>
      <text x="175" y="311" text-anchor="middle" fill="#e2e8f0" font-size="10">ApplyOrderServiceImpl (编排)</text>

      <rect x="75" y="335" width="200" height="20" rx="3" fill="rgba(6,78,59,0.2)" stroke="#34d399" stroke-width="0.5"/>
      <text x="175" y="350" text-anchor="middle" fill="#94a3b8" font-size="8">Factory / Convert / Assembler</text>

      <!-- Anti-corruption -->
      <rect x="290" y="185" width="100" height="32" rx="4" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1"/>
      <text x="340" y="206" text-anchor="middle" fill="#e2e8f0" font-size="9">防腐: Cmd→DTO</text>

      <!-- Domain boxes -->
      <rect x="75" y="405" width="160" height="32" rx="4" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1"/>
      <text x="155" y="426" text-anchor="middle" fill="#e2e8f0" font-size="10">ApplyOrderEntity (聚合根)</text>

      <rect x="75" y="450" width="160" height="20" rx="3" fill="rgba(76,29,149,0.2)" stroke="#a78bfa" stroke-width="0.5"/>
      <text x="155" y="464" text-anchor="middle" fill="#94a3b8" font-size="8">DetailVO / ExpressVO (值对象)</text>

      <rect x="75" y="480" width="160" height="20" rx="3" fill="rgba(76,29,149,0.2)" stroke="#a78bfa" stroke-width="0.5"/>
      <text x="155" y="494" text-anchor="middle" fill="#94a3b8" font-size="8">Repository接口 / Gateway接口</text>

      <!-- Infra boxes -->
      <rect x="75" y="545" width="160" height="32" rx="4" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1"/>
      <text x="155" y="566" text-anchor="middle" fill="#e2e8f0" font-size="10">RepositoryImpl (内存Map)</text>

      <rect x="75" y="590" width="160" height="20" rx="3" fill="rgba(251,146,60,0.2)" stroke="#fb923c" stroke-width="0.5"/>
      <text x="155" y="604" text-anchor="middle" fill="#94a3b8" font-size="8">GatewayImpl / MqSenderImpl</text>

      <!-- === CQRS: Query Side (Right) === -->
      <rect x="600" y="72" width="440" height="78" rx="5" fill="#0f172a" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="820" y="92" text-anchor="middle" fill="#22d3ee" font-size="10">CQRS Query（读）</text>

      <rect x="620" y="100" width="140" height="32" rx="4" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
      <text x="690" y="121" text-anchor="middle" fill="#e2e8f0" font-size="10">ApplyOrderQueryFacade</text>

      <rect x="620" y="185" width="140" height="32" rx="4" fill="rgba(120,53,15,0.4)" stroke="#fbbf24" stroke-width="1"/>
      <text x="690" y="206" text-anchor="middle" fill="#e2e8f0" font-size="10">QueryFacadeImpl</text>

      <rect x="620" y="290" width="200" height="32" rx="4" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1"/>
      <text x="720" y="311" text-anchor="middle" fill="#e2e8f0" font-size="10">ApplyOrderQueryServiceImpl</text>

      <!-- Adapter extensions -->
      <text x="55" y="252" fill="#fbbf24" font-size="9">扩展: Scheduler / Callback / MQ Consumer / ExceptionHandler</text>

      <!-- Domain Gateway interfaces -->
      <rect x="280" y="405" width="140" height="32" rx="4" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1"/>
      <text x="350" y="426" text-anchor="middle" fill="#e2e8f0" font-size="10">CompanyGateway (防腐)</text>

      <rect x="280" y="450" width="140" height="32" rx="4" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1"/>
      <text x="350" y="471" text-anchor="middle" fill="#e2e8f0" font-size="10">MqSender (MQ抽象)</text>

      <!-- Common boxes -->
      <rect x="75" y="652" width="160" height="28" rx="4" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1"/>
      <text x="155" y="671" text-anchor="middle" fill="#e2e8f0" font-size="9">BusinessException</text>

      <rect x="250" y="652" width="140" height="28" rx="4" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1"/>
      <text x="320" y="671" text-anchor="middle" fill="#e2e8f0" font-size="9">ApplyOrderStatusEnum</text>

      <rect x="405" y="652" width="100" height="28" rx="4" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1"/>
      <text x="455" y="671" text-anchor="middle" fill="#e2e8f0" font-size="9">Result&lt;T&gt;</text>

      <!-- === External Systems === -->
      <rect x="780" y="545" width="140" height="40" rx="4" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="850" y="568" text-anchor="middle" fill="#94a3b8" font-size="9">外部 RPC 服务</text>

      <rect x="940" y="545" width="100" height="40" rx="4" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="990" y="568" text-anchor="middle" fill="#94a3b8" font-size="9">消息队列</text>

      <!-- === Arrows: Command Flow === -->
      <line x1="145" y1="132" x2="145" y2="182" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="145" y1="217" x2="175" y2="287" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="175" y1="322" x2="155" y2="402" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="155" y1="437" x2="155" y2="542" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Anti-corruption flow -->
      <line x1="215" y1="201" x2="287" y2="201" stroke="#fb923c" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/>

      <!-- Domain → Infra (interface) -->
      <line x1="235" y1="490" x2="235" y2="542" stroke="#a78bfa" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Infra → External -->
      <line x1="235" y1="565" x2="777" y2="565" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="500" y="558" fill="#94a3b8" font-size="7">RPC 调用</text>

      <line x1="155" y1="577" x2="937" y2="560" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arrow)"/>
      <text x="540" y="588" fill="#94a3b8" font-size="7">MQ 发布</text>

      <!-- === Arrows: Query Flow === -->
      <line x1="690" y1="132" x2="690" y2="182" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="690" y1="217" x2="720" y2="287" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="720" y1="322" x2="720" y2="370" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Dependency arrows (right side) -->
      <text x="550" y="400" fill="#94a3b8" font-size="7" text-anchor="middle">依赖方向: Domain ← App ← Adapter ← API</text>
      <text x="550" y="700" fill="#94a3b8" font-size="7" text-anchor="middle">Common 被所有层依赖</text>

    </svg>
  </div>
</div>
</body>
</html>
